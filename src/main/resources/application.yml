spring:
  application:
    name: simurgh-core

  datasource:
    url: jdbc:postgresql://localhost:5432/simurgh
    username: simurgh
    password: simurgh123

  jpa:
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    root: INFO
    solutions.simurgh.core: DEBUG
    org.springframework: WARN
    org.hibernate: WARN

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] %logger{40} : %msg%n"

simurgh:
  security:
    jwt:
      issuer: https://simurgh.local
      audience: simurgh-api
      access-token-ttl: 15m
      private-key-location: file:/etc/simurgh/security/jwt-private.pem
      public-key-location: file:/etc/simurgh/security/jwt-public.pem